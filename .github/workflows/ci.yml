name: CI

on:
  push:
    branches: [main, "2.2"]
  pull_request:

permissions:
  contents: read

# The fpm release used by every job. The Intel macOS job builds it from source, checked against this digest.
env:
  IOFL_FPM_VERSION: "0.13.0"
  IOFL_FPM_SHA256: 001cff6cf1145f215baa0888ba27acc06cea30a89b79d1a8be97db3fffbc8cd2

jobs:
  test:
    name: ${{ matrix.toolchain.compiler }} ${{ matrix.toolchain.version }} ${{ matrix.toolchain.label }}
    runs-on: ubuntu-24.04
    # LFortran (#82), nvfortran (#75) and AOCC (#80) can't compile the library yet. nvfortran 26.1 rejects two Fortran
    # 2018 features used throughout, implicit none (type, external) and elemental recursive procedures, and AOCC shares
    # its front end. LFortran 0.58 crashes on the first file. Their jobs show how far they get, without failing CI.
    continue-on-error: ${{ matrix.toolchain.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # The tests cover every kind in one build. flang has no real128, so it builds without those procedures.
        toolchain:
          - { compiler: gcc, version: "13", fpm: gfortran, flags: "-std=f2018 -O2 -g -fbacktrace" }
          - { compiler: gcc, version: "14", fpm: gfortran, flags: "-std=f2018 -O2 -g -fbacktrace" }
          - { compiler: gcc, version: "15", fpm: gfortran, flags: "-std=f2018 -O2 -g -fbacktrace" }
          - { compiler: gcc, version: "16", fpm: gfortran, flags: "-std=f2018 -O2 -g -fbacktrace" }
          - { compiler: intel, version: "2025.3", fpm: ifx, flags: "-stand f18 -O2" }
          - { compiler: intel, version: "2026.1", fpm: ifx, flags: "-stand f18 -O2" }
          - { compiler: intel, version: "2026.1", fpm: ifx, label: "runtime checks",
              flags: "-stand f18 -check all -check nouninit -O0 -g -traceback -assume byterecl" }
          - { compiler: flang, version: "23", fpm: flang, flags: "-O2" }
          - { compiler: nvidia-hpc, version: "26.1", fpm: nvfortran, flags: "-O2", experimental: true,
              label: "(allowed to fail)" }
          # AOCC's flang is classic Flang, which fpm only recognizes under the name flang-classic. Under the name flang it
          # gets LLVM flang's options, which it rejects. fpm passes classic Flang no preprocessor flag.
          - { compiler: aocc, version: "5.2.0", fpm: flang-classic, flags: "-Mpreprocess -O2", experimental: true,
              label: "(allowed to fail)" }
          - { compiler: lfortran, version: "0.58.0", fpm: lfortran, flags: "", experimental: true,
              label: "(allowed to fail)" }
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        if: matrix.toolchain.compiler != 'flang'
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      # setup-fortran checks for the release by grepping apt.llvm.org's dists listing, which is now
      # served compressed, so the check fails although the packages exist. Install them directly.
      - name: Install LLVM Flang from apt.llvm.org
        if: matrix.toolchain.compiler == 'flang'
        run: |
          v=${{ matrix.toolchain.version }}
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$v main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-$v.list
          sudo apt-get update -q
          sudo apt-get install -y -q flang-$v clang-$v libomp-$v-dev libclang-rt-$v-dev
          echo "/usr/lib/llvm-$v/bin" >> "$GITHUB_PATH"
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: v${{ env.IOFL_FPM_VERSION }}
      - name: Name AOCC's flang flang-classic for fpm
        if: matrix.toolchain.compiler == 'aocc'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$(command -v flang)" > "$RUNNER_TEMP/bin/flang-classic"
          chmod +x "$RUNNER_TEMP/bin/flang-classic"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          set -o pipefail
          fpm test --compiler ${{ matrix.toolchain.fpm }} --flag "${{ matrix.toolchain.flags }}" \
            ${{ matrix.toolchain.experimental && '--verbose' || '' }} 2>&1 | tee test.log
      - name: Summarize the first errors
        if: failure() && matrix.toolchain.experimental
        run: |
          {
            echo "### First errors from ${{ matrix.toolchain.compiler }} ${{ matrix.toolchain.version }}"
            echo '```'
            grep -m 15 -iE 'error|not (yet )?(implemented|supported)|segmentation fault|core dumped|internal compiler|abort' \
              test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Find the LFortran stage that fails
        if: failure() && matrix.toolchain.compiler == 'lfortran'
        run: |
          for stage in --show-ast --show-asr; do
            if lfortran --cpp -Iinclude $stage src/modules/io_fortran_lib_mod.f90 > /dev/null 2> stage.log; then
              echo "$stage: passes" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$stage: fails with status $?" | tee -a "$GITHUB_STEP_SUMMARY"; tail -5 stage.log
            fi
          done

  arm64:
    name: ubuntu-24.04-arm ${{ matrix.compiler }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # setup-fortran has no ARM Linux runners, so the compilers come from apt. gfortran has REAL(16) here, as IEEE
        # quad precision in software, so this tests real128 on a target other than x86-64.
        include:
          - { compiler: gfortran, fc: gfortran-14, flags: "-std=f2018 -O2 -g -fbacktrace" }
          - { compiler: flang, fc: flang, flags: "-O2" }
    steps:
      - uses: actions/checkout@v7
      - name: Install gfortran
        run: sudo apt-get update -q && sudo apt-get install -y -q gfortran-14
      - name: Install LLVM Flang from apt.llvm.org
        if: matrix.compiler == 'flang'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-23.list
          sudo apt-get update -q
          sudo apt-get install -y -q flang-23 clang-23 libomp-23-dev libclang-rt-23-dev
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - name: Build fpm from its single-file source
        run: |
          mkdir -p "$HOME/fpm-bin" && cd "$HOME/fpm-bin"
          src="fpm-$IOFL_FPM_VERSION.F90"
          curl -fsSLO "https://github.com/fortran-lang/fpm/releases/download/v$IOFL_FPM_VERSION/$src"
          echo "$IOFL_FPM_SHA256  $src" | sha256sum -c -
          gfortran-14 -O2 -J . "$src" -o fpm
          echo "$HOME/fpm-bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: fpm test --compiler ${{ matrix.fc }} --flag "${{ matrix.flags }}"

  big-endian:
    name: s390x gfortran (big-endian, under QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - name: Build and test on s390x
        # Emulation is slow, so this builds with the script rather than building fpm first, and at -O1.
        run: |
          docker run --rm --platform linux/s390x -v "$PWD:/src" -w /src ubuntu:24.04 bash -c '
            set -euo pipefail
            apt-get update -q > /dev/null && apt-get install -y -q gfortran > /dev/null
            gfortran --version | head -1
            ci/build-without-fpm.sh gfortran -cpp build/s390x -O1
            gfortran -cpp -O1 -I build/s390x example/quickstart.f90 build/s390x/libIO-Fortran-Library.a -o build/quickstart
            build/quickstart
          '
      - name: NumPy reads the .npy file written on s390x
        run: |
          python3 -m pip install -q numpy
          python3 - <<'PY'
          import numpy as np
          x = np.load("x.npy")
          expected = np.array([1.0, 2.5, -3.0, 4.0, 5.5, 6.25], dtype=np.float32).reshape((3, 2), order="F")
          print(x.dtype.str, x.shape, x.tolist())
          assert x.dtype.str == ">f4", f"expected a big-endian float32 file, got {x.dtype.str}"
          assert x.shape == (3, 2) and np.array_equal(x, expected), "values differ"
          PY

  no-fpm:
    name: build without fpm, ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, version: "16", fc: gfortran, pp: "-cpp", flags: "-std=f2018 -O2" }
          - { compiler: intel, version: "2026.1", fc: ifx, pp: "-fpp", flags: "-stand f18 -O2" }
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      - name: Build as README.md describes, and run the tests
        run: ci/build-without-fpm.sh ${{ matrix.fc }} ${{ matrix.pp }} build/nofpm ${{ matrix.flags }}

  platforms:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-fpm's macOS binaries need Homebrew's gcc@12 runtime, which the runners don't have, so on macOS fpm is
          # built from source. flang can't compile fpm, so the flang job builds it with Homebrew's gfortran.
          # Apple Silicon has no REAL(16), so this also tests building without the real128 procedures.
          - { os: macos-15, compiler: gcc, version: "16", flags: "-std=f2018 -O2 -g -fbacktrace", fpm: source }
          - { os: macos-15, compiler: flang, version: "23", flags: "-O2", fpm: source, fpm_fc: gfortran }
          # Intel macOS has REAL(16), but Homebrew has no gcc 16 for it.
          - { os: macos-15-intel, compiler: gcc, version: "15", flags: "-std=f2018 -O2 -g -fbacktrace", fpm: source }
          - { os: windows-2025, compiler: gcc, version: "16", flags: "-std=f2018 -O2 -g -fbacktrace" }
          # setup-fortran sets cl as the C compiler, which ignores the -o that fpm passes, so the tests' C file
          # is compiled with LLVM's clang.
          - { os: windows-2025, compiler: intel, version: "2026.1", flags: "", cc: clang }
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      - uses: fortran-lang/setup-fpm@v10
        if: matrix.fpm != 'source'
        with:
          fpm-version: v${{ env.IOFL_FPM_VERSION }}
      - name: Build fpm from its single-file source
        if: matrix.fpm == 'source'
        run: |
          mkdir -p "$HOME/fpm-bin" && cd "$HOME/fpm-bin"
          src="fpm-$IOFL_FPM_VERSION.F90"
          curl -fsSLO "https://github.com/fortran-lang/fpm/releases/download/v$IOFL_FPM_VERSION/$src"
          echo "$IOFL_FPM_SHA256  $src" | shasum -a 256 -c -
          fc="${{ matrix.fpm_fc || steps.setup-fortran.outputs.fc }}"
          if ! command -v "$fc" > /dev/null; then brew install gcc; fi
          "$fc" -O2 -J . "$src" -o fpm
          echo "$HOME/fpm-bin" >> "$GITHUB_PATH"
      - name: Move GNU link aside so that ifx finds the Microsoft linker
        if: runner.os == 'Windows' && matrix.compiler == 'intel'
        shell: pwsh
        run: |
          Get-Command link -All -CommandType Application -ErrorAction SilentlyContinue |
            Where-Object { $_.Source -notmatch 'Microsoft Visual Studio' } |
            ForEach-Object { Write-Host "Moving $($_.Source)"; Rename-Item $_.Source "$($_.Source).gnu" }
          Get-Command link -All -CommandType Application -ErrorAction SilentlyContinue | ForEach-Object { $_.Source }
      - name: Run tests
        run: >-
          fpm test --compiler ${{ steps.setup-fortran.outputs.fc }} --flag "${{ matrix.flags }}"
          ${{ matrix.cc && format('--c-compiler {0}', matrix.cc) || '' }}

  checks:
    name: gfortran 16 runtime checks and sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "16"
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: v${{ env.IOFL_FPM_VERSION }}
      - name: Runtime checks
        run: fpm test --compiler gfortran --flag "-std=f2018 -g -fcheck=all -fbacktrace"
      - name: Address and undefined behavior sanitizers
        # Leak checks are on: every case runs in a subroutine, so nothing is left allocated at the end of the program.
        env:
          ASAN_OPTIONS: detect_leaks=1:exitcode=99
        run: >-
          fpm test --compiler gfortran
          --flag "-std=f2018 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          --link-flag "-fsanitize=address,undefined"

  examples:
    name: examples build and run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "16"
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: v${{ env.IOFL_FPM_VERSION }}
      - name: The README's quick start matches example/quickstart.f90
        shell: python
        run: |
          import re, sys
          readme = open("README.md").read()
          marker = "<!-- This block must match example/quickstart.f90; CI checks it. -->"
          block = re.search(r"```fortran\n(.*?)```", readme[readme.index(marker):], re.S).group(1)
          if block != open("example/quickstart.f90").read():
              sys.exit("README.md's quick start differs from example/quickstart.f90")
      - name: Run every example
        # The tutorials include these files, so this keeps the documented programs working. The logging examples
        # read an exit status, so they are given 0.
        run: |
          for f in example/*.f90; do
            e=$(basename "$f" .f90)
            echo "::group::$e"
            echo 0 | fpm run --example "$e" --flag "-std=f2018 -O2 -g -fbacktrace"
            echo "::endgroup::"
          done

  generated:
    name: generated sources match the fypp templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install fypp
        run: pipx install fypp==3.2
      - name: Generate
        run: ./fypp/generate.sh
      - name: Compare
        run: |
          git diff --exit-code -- src test
          test -z "$(git status --porcelain -- src test)" || { git status --porcelain -- src test; exit 1; }
