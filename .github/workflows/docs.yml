name: Docs

# Builds the documentation with FORD on every push and pull request, so that problems show up in review, and deploys
# it to GitHub Pages from main. The site keeps its doc/ path, so existing links still work.

on:
  push:
    branches: [main, "2.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install FORD
        run: pipx install ford==7.0.13
      - name: Build
        run: ford ford-API-index.md -o _site/doc
      - name: Redirect the site root to the documentation
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>IO-Fortran-Library</title>
          <meta http-equiv="refresh" content="0; url=doc/index.html">
          <link rel="canonical" href="doc/index.html">
          <a href="doc/index.html">IO-Fortran-Library documentation</a>
          HTML
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
